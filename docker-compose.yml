services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    networks:
      - caseroom

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - path: ./.env
        required: false
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - caseroom

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: caseroom
      POSTGRES_PASSWORD: caseroom
      POSTGRES_DB: caseroom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseroom"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - caseroom

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - caseroom

volumes:
  pgdata:
  frontend_node_modules:

networks:
  caseroom:
    driver: bridge
