[project]
name = "caseroom-backend"
version = "0.1.0"
description = "CaseRoom backend — FastAPI + Strawberry GraphQL + SSE (Phase 0 scaffold)."
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fastapi",
    "uvicorn[standard]",
    "strawberry-graphql[fastapi]",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "asyncpg",
    "redis>=5",
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "mcp>=1.28.0",
    "arq>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not dbintegration'"
markers = [
    "dbintegration: tests that require a live Postgres (deselected by default; run with -m dbintegration)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
